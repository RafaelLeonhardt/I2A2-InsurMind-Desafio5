[project]
name = "central-preventiva-backend"
version = "0.1.0"
description = "API local da prova de conceito educacional Central Preventiva."
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
  "duckdb>=1.4.4,<2",
  "fastapi>=0.135.1,<1",
  "pydantic>=2.12.5,<3",
  "pydantic-settings>=2.13.1,<3",
  "uvicorn>=0.42.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "pyright>=1.1.408,<2",
  "pytest>=9.0.2,<10",
  "ruff>=0.15.7,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["testes"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["central_preventiva"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["central_preventiva"]
